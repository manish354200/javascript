<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .card{
      height: 100px;
      width: 100px;
      background-color: aqua;
    }
    table{
      width: 100px;
      background-color: aliceblue;
    }
    .data{
      justify-items: center;
    }
  .pic img {
  max-width: 100%;
  max-height: 100%;
  
}


  </style>
</head>
<body style="background-color: #212121">
  <!-- 0 UNSENT Client has been created. open() not called yet.
  1 OPENED open() has been called.
  2 HEADERS_RECEIVED send() has been called, and headers and status  
  are available.
  3 LOADING Doenloading; responseText holds partial data.  
  4 DONE  the operation is complete. -->
<div class="card">
  <div class="pic"></div>
  <div class="data">
     <table>
      <tr>
        <th class="numbers"> </th>
      </tr>
      <tr>
        <th>Followers</th>
      </tr>
     </table>
  </div>

</div>
  
</body>
<script>
  const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
  const xhr= new XMLHttpRequest();
  xhr.open('GET',requestUrl) // start
  const img=document.querySelector('.pic')
  const num=document.querySelector('.numbers')
  xhr.onreadystatechange = function(){ // to track all states
    console.log(xhr.readyState);
    if(xhr.readyState===4){
      const data = JSON.parse(this.responseText) // this is used to tell that we are talking about that parenthesis context
      // parse is a method to conbert string to JSON(type object)..
      img.innerHTML = `<img src="${data.avatar_url}" width:"150">`
      num.innerHTML=data.followers
      console.log(typeof data);
      console.log(data.followers)
    }
  }
  xhr.send(); //use to call open..
</script>
</html>
